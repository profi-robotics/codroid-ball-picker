name: Release And Publish

on:
  push:
    branches:
      - master

permissions:
  contents: write
  packages: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release-and-publish:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout codroid-ball-picker
        uses: actions/checkout@v4
        with:
          path: codroid-ball-picker
          fetch-depth: 0

      - name: Checkout codroid-api
        uses: actions/checkout@v4
        with:
          repository: profi-robotics/codroid-api
          path: codroid-api
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Checkout onrobot-api
        uses: actions/checkout@v4
        with:
          repository: profi-robotics/onrobot-api
          path: onrobot-api
          token: ${{ secrets.CI_REPO_READ_TOKEN || github.token }}

      - name: Validate dependency checkouts
        shell: bash
        run: |
          set -euo pipefail

          normalize_repo_root() {
            local repo_dir="$1"
            local marker_file=""
            local nested_root=""

            if [ -f "${repo_dir}/pyproject.toml" ] || [ -f "${repo_dir}/setup.py" ]; then
              echo "${repo_dir}: package root detected at repository root"
              return 0
            fi

            marker_file=$(find "${repo_dir}" -mindepth 2 -maxdepth 4 -type f \( -name pyproject.toml -o -name setup.py \) | head -n1 || true)
            if [ -z "${marker_file}" ]; then
              echo "::error::${repo_dir} does not contain a Python package root (pyproject.toml or setup.py)."
              ls -la "${repo_dir}" || true
              exit 1
            fi

            nested_root=$(dirname "${marker_file}")
            echo "${repo_dir}: using nested package root ${nested_root}"

            rm -rf "${repo_dir}/.normalized-tmp"
            mv "${nested_root}" "${repo_dir}/.normalized-tmp"
            find "${repo_dir}" -mindepth 1 -maxdepth 1 ! -name '.normalized-tmp' -exec rm -rf {} +
            cp -a "${repo_dir}/.normalized-tmp/." "${repo_dir}/"
            rmdir "${repo_dir}/.normalized-tmp"
          }

          normalize_repo_root "codroid-api"
          normalize_repo_root "onrobot-api"

      - name: Compute next version tag
        id: version
        working-directory: codroid-ball-picker
        shell: bash
        run: |
          set -euo pipefail

          git fetch --force --tags origin

          current_head_tag=$(git tag --points-at HEAD --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
          if [ -n "${current_head_tag}" ]; then
            echo "next_tag=${current_head_tag}" >> "${GITHUB_OUTPUT}"
            echo "create_tag=false" >> "${GITHUB_OUTPUT}"
            exit 0
          fi

          latest_tag=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-version:refname | head -n1)
          default_version=$(sed -n 's/^version = "\([^"]\+\)"$/\1/p' pyproject.toml | head -n1)

          if [ -z "${default_version}" ]; then
            default_version="0.1.0"
          fi

          if [ -z "${latest_tag}" ]; then
            next_tag="v${default_version}"
          else
            version="${latest_tag#v}"
            IFS='.' read -r major minor patch <<<"${version}"
            next_patch=$((patch + 1))
            next_tag="v${major}.${minor}.${next_patch}"
          fi

          echo "next_tag=${next_tag}" >> "${GITHUB_OUTPUT}"
          echo "create_tag=true" >> "${GITHUB_OUTPUT}"

      - name: Create and push git tag
        if: ${{ steps.version.outputs.create_tag == 'true' }}
        working-directory: codroid-ball-picker
        shell: bash
        run: |
          set -euo pipefail

          tag="${{ steps.version.outputs.next_tag }}"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git rev-parse "${tag}" >/dev/null 2>&1; then
            echo "Tag ${tag} already exists"
            exit 1
          fi

          git tag -a "${tag}" -m "Release ${tag}"
          git push origin "${tag}"

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push container image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: codroid-ball-picker/Dockerfile
          push: true
          platforms: linux/arm64/v8
          build-args: |
            JETSON_BASE_IMAGE=nvcr.io/nvidia/l4t-jetpack:r36.4.0
          cache-from: type=gha
          cache-to: type=gha,mode=max
          tags: |
            ghcr.io/profi-robotics/codroid-ball-picker:${{ steps.version.outputs.next_tag }}
            ghcr.io/profi-robotics/codroid-ball-picker:latest
            ghcr.io/profi-robotics/codroid-ball-picker:sha-${{ github.sha }}

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.next_tag }}
          generate_release_notes: true
