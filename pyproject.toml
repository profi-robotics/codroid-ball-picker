[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "codroid-ball-picker"
version = "0.1.0"
description = "Vision-guided Estun Codroid ball picker workflow scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python-headless",
    "numpy",
    "websockets",
    "depthai==3.2.1",
    "codroid-api",
    "onrobot-api",
    "pillow>=12.1.0",
    "nvidia-ml-py>=12.560.30",
    "psutil>=6.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "anyio>=4.6.0",
    "sse-starlette>=2.1.3",
]

# PyTorch is listed separately because Jetson requires special wheels
# On x86_64 Linux/Windows/macOS: uv sync --extra torch
# On Jetson (aarch64): uv pip install torch torchvision --index-url https://developer.download.nvidia.com/compute/redist/jp/v60
# See docs/deploy_jetson_docker.md for details
[project.optional-dependencies]
torch = [
    "torch>=2.0.0",
    "torchvision>=0.15.0",
]
ml = [
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage[toml]>=7.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    # Legacy Dash stack is kept out of runtime deps but remains available
    # during the migration so old modules/tests can still be inspected.
    "dash[async]>=3.3.0",
    "dash-mantine-components>=2.4.1",
    "aiortc>=1.14.0",
]

[tool.uv.sources]
codroid-api = { git = "https://github.com/profi-robotics/codroid-api.git", branch = "master" }
onrobot-api = { git = "https://github.com/profi-robotics/onrobot-api.git", branch = "master" }

# PyTorch from NVIDIA for Jetson (JetPack 6 / L4T R36.x / CUDA 12.x)
# uv does not yet support conditional index URLs per-extra, so for Jetson:
#   1. Install without torch extra: uv sync
#   2. Install CUDA-enabled torch manually:
#      uv pip install torch torchvision --index-url https://developer.download.nvidia.com/compute/redist/jp/v60
# Or use pip directly in the venv:
#      .venv/bin/pip install torch torchvision --index-url https://developer.download.nvidia.com/compute/redist/jp/v60

[tool.hatch.build.targets.wheel]
packages = ["codroid_picker", "vision"]

[tool.ruff]
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["vision.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"
markers = [
    "unit: fast deterministic tests that do not require hardware",
    "integration: tests that exercise subsystem integration with mocks/fakes",
    "hardware: tests that require real robot/camera/gripper hardware",
    "legacy: tests that intentionally protect the old Dash/WebRTC surface during migration",
]
