[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "codroid-ball-picker"
version = "0.1.0"
description = "Vision-guided Estun Codroid ball picker workflow scaffold."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python-headless",
    "numpy>=1.26.4,<2",
    "websockets",
    "depthai==3.2.1",
    "codroid-api",
    "onrobot-api",
    "pillow>=12.1.0",
    "nvidia-ml-py>=12.560.30",
    "psutil>=6.1.0",
    "pydantic>=2.12.5",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "jinja2>=3.1.4",
    "python-multipart>=0.0.12",
    "anyio>=4.6.0",
    "sse-starlette>=2.1.3",
    "ultralytics>=8.3.0",
]

# PyTorch is listed separately because Jetson requires wheels built for the
# device GPU architecture. On this JP6/CUDA 12.6 Jetson Orin Nano, the torch
# extra resolves torch/torchvision/torchaudio from the Jetson AI Lab index.
# See docs/deploy_jetson_docker.md for details.
[project.optional-dependencies]
torch = [
    "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchaudio==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
]
ml = [
    "ultralytics>=8.3.0",
]

[dependency-groups]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "coverage[toml]>=7.6.0",
    "ruff>=0.8.0",
    "mypy>=1.13.0",
    "httpx>=0.27.0",
    # Legacy Dash stack is kept out of runtime deps but remains available
    # during the migration so old modules/tests can still be inspected.
    "dash[async]>=3.3.0",
    "dash-mantine-components>=2.4.1",
    "aiortc>=1.14.0",
]

[tool.uv.sources]
codroid-api = { path = "../codroid-api", editable = true }
onrobot-api = { path = "../onrobot-api", editable = true }
torch = { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" }
torchvision = { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" }
torchaudio = { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" }

[[tool.uv.index]]
name = "jetson-ai-lab-jp6-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

# PyTorch for Jetson must not be replaced by PyPI CPU/incompatible CUDA wheels.
# Use scripts/install_jetson_torch.sh for host installs; it rebuilds the venv
# with system Python 3.10 and installs the torch extra from the index above.

[tool.hatch.build.targets.wheel]
packages = ["codroid_picker", "vision"]

[tool.ruff]
extend-exclude = ["scripts"]

[tool.ruff.lint]
select = ["E9", "F63", "F7"]

[tool.mypy]
strict = true

[[tool.mypy.overrides]]
module = ["vision.*"]
ignore_errors = true

[tool.pytest.ini_options]
addopts = "-p no:launch_testing -p no:launch_ros"
markers = [
    "unit: fast deterministic tests that do not require hardware",
    "integration: tests that exercise subsystem integration with mocks/fakes",
    "hardware: tests that require real robot/camera/gripper hardware",
    "legacy: tests that intentionally protect the old Dash/WebRTC surface during migration",
]
