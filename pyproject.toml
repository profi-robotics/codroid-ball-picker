[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "codroid-ball-picker"
version = "0.1.0"
description = "Vision-guided Estun Codroid ball picker workflow scaffold."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "opencv-python",
    "numpy",
    "websockets",
    "depthai==3.2.1",
    "codroid-api",
    "onrobot-api",
    "dash[async]>=3.3.0",
    "dash-mantine-components>=2.4.1",
    "pillow>=12.1.0",
    "ultralytics>=8.3.0",
    "torch>=2.0.0",
    "torchvision>=0.15.0",
    "nvidia-ml-py>=12.560.30",
    "psutil>=6.1.0",
    "pydantic>=2.12.5",
]

[tool.uv.sources]
codroid-api = { path = "../codroid-api", editable = true }
onrobot-api = { path = "../onrobot-api", editable = true }

[tool.hatch.build.targets.wheel]
packages = ["app", "robot", "vision"]
