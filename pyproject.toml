[build-system]
requires = ["hatchling>=1.24.0"]
build-backend = "hatchling.build"

[project]
name = "codroid-ball-picker"
version = "0.1.0"
description = "Vision-guided Estun Codroid ball picker workflow scaffold."
readme = "README.md"
requires-python = ">=3.10,<3.13"
dependencies = [
    "opencv-python",
    "numpy>=1.26.4,<2",
    "websockets",
    "depthai==3.2.1",
    "codroid-api",
    "onrobot-api",
    "dash[async]>=3.3.0",
    "dash-mantine-components>=2.4.1",
    "pillow>=12.1.0",
    "nvidia-ml-py>=12.560.30",
    "psutil>=6.1.0",
    "pydantic>=2.12.5",
    "pypandoc-binary>=1.16.2",
    "weasyprint>=68.1",
]

# YOLO/Torch is profile-specific. Keep it out of the base install so x86
# workstations do not resolve Jetson-only torch wheels, and Jetson installs do
# not accidentally pull PyPI CPU/incompatible CUDA wheels.
[project.optional-dependencies]
workstation = [
    "ultralytics>=8.3.0",
    "torch>=2.2,<3; platform_machine != 'aarch64' or python_version >= '3.11'",
    "torchvision>=0.17,<1; platform_machine != 'aarch64' or python_version >= '3.11'",
]
jetson = [
    "ultralytics>=8.3.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchaudio==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
]
# Backward-compatible alias for older setup notes.
torch = [
    "ultralytics>=8.3.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torch==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchvision==0.23.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
    "torchaudio==2.8.0; sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'",
]

[tool.uv.sources]
codroid-api = { git = "https://github.com/profi-robotics/codroid-api.git", rev = "ab7546bccce1b85328478e89dd5343ccd37bced9" }
onrobot-api = { git = "https://github.com/profi-robotics/onrobot-api.git", rev = "86918ea798f0f55d49af69e2d173c5ec4bf96285" }
torch = [
    { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'aarch64' or python_version >= '3.11'" },
]
torchvision = [
    { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" },
    { index = "pytorch-cpu", marker = "platform_machine != 'aarch64' or python_version >= '3.11'" },
]
torchaudio = { index = "jetson-ai-lab-jp6-cu126", marker = "sys_platform == 'linux' and platform_machine == 'aarch64' and python_version == '3.10'" }

[[tool.uv.index]]
name = "jetson-ai-lab-jp6-cu126"
url = "https://pypi.jetson-ai-lab.io/jp6/cu126"
explicit = true

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv]
# The codroid-api and onrobot-api packages require Python 3.11+.
# Limit the checked-in lock to non-Jetson workstation/runtime environments;
# Jetson GPU installs are handled by the dedicated Jetson deployment flow.
environments = [
    "python_version >= '3.11' and python_version < '3.13' and platform_machine != 'aarch64'",
]

# PyTorch for Jetson must not be replaced by PyPI CPU/incompatible CUDA wheels.
# Use the jetson extra on Jetson and the workstation extra everywhere else.

[tool.hatch.build.targets.wheel]
packages = ["app", "robot", "vision"]
