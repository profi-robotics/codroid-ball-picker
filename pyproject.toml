[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "codroid-vision-guided-bootstrap-demo"
version = "0.1.0"
description = "Scaffold for the Estun Codroid + OAK-D bootstrap workflow."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "opencv-python",
    "numpy",
    "websockets",
    "depthai==3.2.1",
]

[tool.setuptools.packages.find]
include = ["app", "robot", "vision"]
