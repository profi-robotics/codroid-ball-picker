services:
  ui:
    build:
      context: ..
      dockerfile: codroid-ball-picker/Dockerfile
    container_name: codroid-ui
    restart: unless-stopped
    runtime: nvidia
    environment:
      - NVIDIA_VISIBLE_DEVICES=all
      - NVIDIA_DRIVER_CAPABILITIES=compute,utility,video
      - UV_PROJECT_ENVIRONMENT=/app/.venv
    ports:
      - "8050:8050"
    devices:
      - "/dev/bus/usb:/dev/bus/usb" # OAK-D / USB devices
      - "/dev/video0:/dev/video0" # Optional: camera passthrough
    volumes:
      - ./data:/app/data # persist calibration/workspace data
    command:
      [
        "uv",
        "run",
        "python",
        "run_codroid_picker.py",
        "--host",
        "0.0.0.0",
        "--port",
        "8050",
      ]
